# Alias multilingues — français ↔ wolof ↔ anglais (VOLET multilingue, 2026-08-14).
#
# Ce fichier existe parce que les données acquises sont en anglais (`currency`,
# `population`, `capital`) et que les questions arrivent en français ou en
# wolof. Sans lui, « Quelle est la monnaie du Sénégal ? » ne trouvait rien alors
# que la réponse était en base — mesuré, pas supposé.
#
# ## Ce que ce fichier est, et n'est pas
#
# C'est une **table de vocabulaire**, pas une table de faits. Elle dit que
# « monnaie », « currency » et « xaalis » désignent la même notion ; elle ne dit
# rien sur le Sénégal. Une erreur ici fait manquer ou ajouter une
# correspondance ; elle ne peut pas fabriquer une affirmation.
#
# ## Provenance des termes wolof
#
# `wo_source: owner` — les termes wolof ont été **déclarés par le propriétaire du
# projet**, locuteur, dans la directive du 2026-08-14. C'est une source, et elle
# est nommée. Ils n'ont pas été confrontés à un dictionnaire : `reviewed: false`
# le dit, et chaque expansion qui s'appuie sur eux porte cette réserve.
#
# `corpus_attested: true` marque les termes retrouvés dans UD_Wolof-WTB — une
# vérification indépendante, mesurée par `python -m pytest tests/test_multilingual.py`.
#
# ## Orthographe
#
# Les termes wolof suivent le standard CLAD (décret n° 2005-992) : `ë`, `ñ`, `ŋ`
# sont des lettres, jamais pliées. L'expansion compare des formes normalisées
# par `src/text_normalization.py`, qui plie les accents des **deux** côtés — la
# comparaison reste donc symétrique et sans perte.

version: "1.0"
wo_source: "propriétaire du projet (locuteur), directive du 2026-08-14"
wo_reviewed: false

concepts:


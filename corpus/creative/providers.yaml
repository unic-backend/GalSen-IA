# Candidate generative providers — research record (directive V4, §37-§40).
#
# This file is EVIDENCE, not a decision. Nothing here selects a provider; C04
# and its ADR do that. What this file holds is what was actually verified, from
# where, and on what date — and, just as importantly, what could not be.
#
# THE RULE THIS FILE EXISTS TO ENFORCE (§40):
#   A repository licence is not a weight licence, and neither is a permission
#   to use commercially. "Open source repository" does not follow from
#   "weights downloadable", and popularity is never evidence of anything.
#
# Every field that was not read from an authoritative source is UNKNOWN and
# carries the reason. `src/creative/research.py` refuses this file at load time
# if that discipline is broken — a matrix that can drift into optimism is worse
# than no matrix, because someone will ship against it.
#
# EVIDENCE LEVELS
#   AUTHORITATIVE : read from the project's own repository or licence file
#   SECONDARY     : a search result, an article, a third-party summary
#   NONE          : not checked
#
# MEASURED ENVIRONMENT (2026-08-16, this container):
#   raw.githubusercontent.com -> 200   official LICENSE/README readable
#   huggingface.co            -> 000   NO ROUTE: model cards and weight
#                                      licences are unreachable from here
#   github.com (HTML)         -> 403   blocked by the proxy
#   api.github.com            -> scoped to unic-backend/galsen-ia only
#   GPU / torch / transformers-> absent: nothing here can execute a model


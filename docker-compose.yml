# =============================================================================
# GalSen IA — Docker Compose
# =============================================================================
# Démarrage :
#   docker-compose up -d
#
# Arrêt :
#   docker-compose down
#
# Services :
#   api     — Serveur API FastAPI (production)
#   api-dev — Serveur API avec rechargement automatique (développement)
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Service principal : API GalSen IA (mode production)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: galsen-ia:latest
    container_name: galsen-ia-api
    restart: unless-stopped

    # Aucun port publié : la seule voie d'entrée est Caddy, sur le réseau
    # interne. Publier 8000 laisserait une route en clair contournant TLS,
    # l'authentification du proxy et son journal d'accès.
    expose:
      - "8000"

    # Volumes pour la persistance des données et les logs
    volumes:
      - galsen_data:/app/data
      - galsen_logs:/app/logs

    # Variables d'environnement chargées depuis .env
    environment:
      # Stockage
      - GALSEN_STORAGE_BACKEND=${GALSEN_STORAGE_BACKEND:-sqlite}
      - GALSEN_BACKUP_DIR=${GALSEN_BACKUP_DIR:-/app/data/backups}

      # Sécurité API
      - GALSEN_API_KEYS=${GALSEN_API_KEYS}

      # Proxys dont les en-têtes X-Forwarded-* sont acceptés. Le réseau bridge
      # par défaut de Docker Compose ; sans cette déclaration, l'application
      # ignore les en-têtes et compte toutes les requêtes comme venant de
      # Caddy — la limite par adresse deviendrait globale.
      - GALSEN_TRUSTED_PROXIES=${GALSEN_TRUSTED_PROXIES:-172.16.0.0/12}

      # Limiteur de taux
      - GALSEN_RATE_LIMIT_ENABLED=${GALSEN_RATE_LIMIT_ENABLED:-true}
      - GALSEN_RATE_LIMIT_AUTHENTICATED_RPM=${GALSEN_RATE_LIMIT_AUTHENTICATED_RPM:-60}
      - GALSEN_RATE_LIMIT_UNAUTHENTICATED_RPM=${GALSEN_RATE_LIMIT_UNAUTHENTICATED_RPM:-30}
      - GALSEN_RATE_LIMIT_BURST_MULTIPLIER=${GALSEN_RATE_LIMIT_BURST_MULTIPLIER:-2.0}

      # Fournisseurs de modèles (clés API)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

      # Hôte local Ollama (si utilisé)
      - OLLAMA_HOST=${OLLAMA_HOST:-}

    # Healthcheck Docker Compose utilisant l'endpoint /health
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # Limites de ressources (ajustables selon l'environnement)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 256M
          cpus: "0.5"

    # Réseau dédié
    networks:
      - galsen-network

  # ---------------------------------------------------------------------------
  # Service de développement : API avec rechargement automatique
  # ---------------------------------------------------------------------------
  # Ce service ne démarre **pas** avec `docker compose up` : il est sous profil.
  # Il tournait auparavant à côté de `api`, avec `restart: unless-stopped` et un
  # port publié — soit une deuxième instance de la plateforme, ce que ADR-009
  # interdit (compteurs de débit et révocations de clés dédoublés), et un
  # service avec rechargement automatique et sans limite de débit exposé sur
  # l'hôte.
  #
  #   docker compose --profile dev up api-dev
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: galsen-ia:dev
    container_name: galsen-ia-api-dev
    restart: unless-stopped

    ports:
      - "${GALSEN_DEV_PORT:-8001}:8000"

    # Monte le code source en direct pour le rechargement
    volumes:
      - ./src:/app/src:ro
      - ./tools:/app/tools:ro
      - galsen_data_dev:/app/data
      - galsen_logs_dev:/app/logs

    environment:
      - GALSEN_STORAGE_BACKEND=${GALSEN_STORAGE_BACKEND:-sqlite}
      - GALSEN_API_KEYS=${GALSEN_API_KEYS:-dev-key}
      - GALSEN_RATE_LIMIT_ENABLED=${GALSEN_RATE_LIMIT_ENABLED:-false}
      - GALSEN_RATE_LIMIT_AUTHENTICATED_RPM=${GALSEN_RATE_LIMIT_AUTHENTICATED_RPM:-60}
      - GALSEN_RATE_LIMIT_UNAUTHENTICATED_RPM=${GALSEN_RATE_LIMIT_UNAUTHENTICATED_RPM:-30}
      - GALSEN_RATE_LIMIT_BURST_MULTIPLIER=${GALSEN_RATE_LIMIT_BURST_MULTIPLIER:-2.0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}

    # Rechargement automatique activé en développement
    command: >
      uvicorn src.api.server:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    networks:
      - galsen-network

  # ---------------------------------------------------------------------------
  # Terminaison TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: galsen-ia-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      # QUIC / HTTP3. Inutile de le publier si le pare-feu ne l'ouvre pas.
      - "443:443/udp"

    environment:
      - GALSEN_DOMAIN=${GALSEN_DOMAIN:-localhost}
      - GALSEN_TLS_EMAIL=${GALSEN_TLS_EMAIL:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # `caddy_data` porte les certificats et les clés privées. **Sans ce
      # volume, chaque redémarrage redemande un certificat** et heurte les
      # limites de Let's Encrypt (cinq échecs par heure et par domaine).
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - galsen-network

# ---------------------------------------------------------------------------
# Volumes nommés (persistance entre les redémarrages)
# ---------------------------------------------------------------------------
volumes:
  galsen_data:
    name: galsen_data
    driver: local
  galsen_logs:
    name: galsen_logs
    driver: local
  galsen_data_dev:
    name: galsen_data_dev
    driver: local
  galsen_logs_dev:
    name: galsen_logs_dev
    driver: local
  caddy_data:
    name: caddy_data
    driver: local
  caddy_config:
    name: caddy_config
    driver: local

# ---------------------------------------------------------------------------
# Réseau dédié
# ---------------------------------------------------------------------------
networks:
  galsen-network:
    name: galsen-network
    driver: bridge

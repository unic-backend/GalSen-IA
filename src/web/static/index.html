<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GalSen IA — Tableau de bord</title>
    <meta
      name="description"
      content="État de la plateforme GalSen IA : moteurs, connecteurs externes et clés d'accès."
    />
    <!-- Icône embarquée : évite une requête supplémentaire, et un 404 dans la
         console à chaque chargement. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b6e4f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/ui/css/dashboard.css" />
  </head>
  <body>
    <header>
      <h1>
        GalSen IA
        <small>Tableau de bord de la plateforme</small>
      </h1>

      <!-- La clé reste dans le navigateur : elle n'est jamais écrite dans une page -->
      <div class="barre-cle">
        <label for="cle-api" class="discret">Clé API</label>
        <input
          id="cle-api"
          type="password"
          autocomplete="off"
          placeholder="X-API-Key"
          aria-label="Clé API"
        />
        <button id="enregistrer-cle" type="button">Appliquer</button>
        <button id="recharger" type="button" class="secondaire">Recharger</button>
        <a href="/ui/studio.html" class="lien-retour">Media Studio</a>
      </div>
    </header>

    <main>
      <!-- Le conseil agricole passe en premier : c'est la fonctionnalité que la
           plateforme rend à ses utilisateurs, le reste sert à l'exploiter. -->
      <section aria-labelledby="titre-conseil" class="pleine-largeur">
        <h2 id="titre-conseil">Conseil agricole</h2>
        <p class="discret">
          Une réponse adaptée au contexte agricole sénégalais, en français ou en
          wolof.
        </p>

        <form id="formulaire-conseil">
          <label for="question-agricole" class="discret">Votre question</label>
          <textarea
            id="question-agricole"
            rows="3"
            placeholder="Ex. : Quand planter le mil à Thiès ?"
          ></textarea>

          <div class="barre-conseil">
            <label for="langue-conseil" class="discret">Langue</label>
            <select id="langue-conseil">
              <option value="fr">Français</option>
              <option value="wo">Wolof</option>
            </select>
            <button id="demander-conseil" type="submit">Obtenir un conseil</button>
          </div>
        </form>

        <div id="conseil"></div>
      </section>

      <section aria-labelledby="titre-sante">
        <h2 id="titre-sante">Santé de la plateforme</h2>
        <div id="sante">
          <p class="discret">Chargement…</p>
        </div>
      </section>

      <section aria-labelledby="titre-connecteurs">
        <h2 id="titre-connecteurs">Connecteurs externes</h2>
        <p>
          <button id="verifier-connecteurs" type="button" class="secondaire">
            Vérifier les services
          </button>
        </p>
        <div id="connecteurs">
          <p class="discret">Chargement…</p>
        </div>
      </section>

      <section aria-labelledby="titre-cles">
        <h2 id="titre-cles">Clés d'accès</h2>
        <div id="cles">
          <p class="discret">Chargement…</p>
        </div>
      </section>
    </main>

    <noscript>
      <p class="message message--info">
        Cette interface a besoin de JavaScript pour interroger l'API. L'état de la
        plateforme reste consultable sur <a href="/health">/health</a>.
      </p>
    </noscript>

    <script type="module" src="/ui/js/dashboard.js"></script>
  </body>
</html>

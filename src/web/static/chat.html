<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GalSen IA</title>
    <meta
      name="description"
      content="GalSen IA — poser une question, et voir sur quoi la réponse repose."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Icône embarquée : une requête de moins, et pas de 404 dans la console.
         Reprise telle quelle du tableau de bord — deux marques différentes pour
         un même produit, c'est déjà une incohérence. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b6e4f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/ui/css/chat.css" />
  </head>

  <body>
    <!-- La page est une seule colonne conversationnelle. Aucune carte, aucun
         panneau d'état : ce qui relevait du diagnostic vit sous /ui/admin. -->
    <div class="application">
      <header class="entete">
        <!-- Le bouton du menu des domaines. Son contenu arrive au chapitre 05 ;
             la place est réservée ici pour que l'entête ne bouge pas ensuite. -->
        <button
          type="button"
          class="bouton-menu"
          id="bouton-menu"
          aria-expanded="false"
          aria-controls="menu-domaines"
          aria-label="Domaines"
        >
          <span aria-hidden="true">☰</span>
        </button>
      <!-- Menu des domaines : 14 capacités sans multiplier les assistants. -->
      <nav class="menu-domaines" id="menu-domaines" hidden>
        <button type="button" class="menu-fermer" id="menu-fermer" aria-label="Fermer le menu">
          <span aria-hidden="true">✕</span>
        </button>
        <h2 class="menu-titre">Domaines</h2>
        <ul class="menu-liste">
          <li><button type="button" class="menu-domaine" data-domaine="agriculture">Agriculture</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="sante">Santé</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="education">Éducation</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="commerce">Commerce</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="energie">Énergie</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="environnement">Environnement</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="finance">Finance</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="gouvernance">Gouvernance</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="infrastructure">Infrastructure</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="juridique">Juridique</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="technologie">Technologie</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="transport">Transport</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="eau">Eau</button></li>
          <li><button type="button" class="menu-domaine" data-domaine="emploi">Emploi</button></li>
        </ul>
        <button type="button" class="menu-reinitialiser">Aucun filtrage</button>
      </nav>


        <div class="marque">
          <span class="sceau" aria-hidden="true">G</span>
          <span class="nom">GalSen&nbsp;IA</span>
        </div>

        <!-- La clé reste dans le navigateur. Elle n'est jamais écrite dans la
             page servie, et jamais envoyée ailleurs qu'à cette API. -->
        <div class="cle">
          <label for="cle-api" class="invisible">Clé API</label>
          <input
            id="cle-api"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="Clé API"
          />
        </div>
      </header>

      <main class="conversation" id="conversation" aria-live="polite">
        <!-- L'accueil. Il disparaît au premier message et ne revient pas. -->
        <section class="accueil" id="accueil">
          <p class="salutation">Nanga def&nbsp;?</p>
          <h1>Pose ta question.</h1>
          <p class="promesse">
            Je réponds avec ce que la plateforme sait vraiment — et je dis quand
            elle ne sait pas.
          </p>

          <ul class="pistes">
            <li>
              <button type="button" class="piste">
                Quand planter le mil à Thiès&nbsp;?
              </button>
            </li>
            <li>
              <button type="button" class="piste">
                Quelles sont les régions du Sénégal&nbsp;?
              </button>
            </li>
            <li>
              <button type="button" class="piste">
                Traduis « bonjour » en wolof
              </button>
            </li>
          </ul>
        </section>
      </main>

      <!-- Le composeur. Toujours visible, jamais recouvert par le clavier
           mobile : c'est un `form`, donc « Entrée » l'envoie sans JavaScript
           supplémentaire. -->
      <form class="composeur" id="composeur" autocomplete="off">
        <label for="message" class="invisible">Ton message</label>
        <textarea
          id="message"
          name="message"
          rows="1"
          placeholder="Écris ici…"
          required
        ></textarea>
        <button type="submit" id="envoyer" aria-label="Envoyer">
          <span aria-hidden="true">↑</span>
        </button>
      </form>

      <!-- Une seule ligne d'état, sous le composeur. Elle porte les erreurs et
           la durée réelle du dernier tour : un chiffre qu'on voit est un
           chiffre qu'on peut décider de réduire. -->
      <p class="etat" id="etat" role="status"></p>
    </div>

    <script type="module" src="/ui/js/chat.js"></script>
  </body>
</html>

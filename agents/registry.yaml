version: "1.0"
default_language: "fr"
orchestrator: "router"

agents:
  - id: router
    enabled: true
    priority: 100
    role: "Central Orchestrator"
    description: "Analyse chaque demande et délègue aux agents appropriés."
    module: "router_engine"  # Special: the router engine itself
  - id: planner
    enabled: true
    priority: 95
    role: "Planning Agent"
    description: "Découpe les objectifs en tâches."
    module: "agents.planner.agent"
  - id: researcher
    enabled: true
    priority: 90
    role: "Research Agent"
    description: "Recherche des informations fiables."
    module: "agents.researcher.agent"
  - id: coder
    enabled: true
    priority: 90
    role: "Software Engineer"
    description: "Écrit le code."
    module: "agents.coder.agent"
  - id: reviewer
    enabled: true
    priority: 85
    role: "Code Reviewer"
    description: "Vérifie la qualité du code."
    module: "agents.reviewer.agent"
  - id: tester
    enabled: true
    priority: 85
    role: "QA Tester"
    description: "Teste les fonctionnalités."
    module: "agents.tester.agent"
  - id: security
    enabled: true
    priority: 90
    role: "Security Agent"
    description: "Analyse les risques de sécurité."
    module: "agents.security.agent"
  - id: documentation
    enabled: true
    priority: 70
    role: "Documentation Agent"
    description: "Met à jour la documentation."
    module: "agents.documentation.agent"
  - id: deployment
    enabled: true
    priority: 80
    role: "Deployment Agent"
    description: "Prépare les déploiements."
    module: "agents.deployment.agent"
  - id: monitor
    enabled: true
    priority: 80
    role: "Monitoring Agent"
    description: "Surveille les performances et les erreurs."
    module: "agents.monitor.agent"
  - id: organizer
    enabled: true
    priority: 60
    role: "File Organizer"
    description: "Propose un rangement des fichiers ; n'exécute qu'approuvé."
    module: "agents.organizer.agent"
  - id: project_manager
    enabled: true
    priority: 75
    role: "Project Manager"
    description: "Rapporte l'état réel des tâches, sans estimation inventée."
    module: "agents.project_manager.agent"
  - id: opportunity
    enabled: true
    priority: 55
    role: "Opportunity Analyst"
    description: "Rassemble des signaux sourcés ; refuse de conclure sans source."
    module: "agents.opportunity.agent"
  - id: verifier
    enabled: true
    priority: 80
    role: "Fact Verification"
    description: "Confronte les affirmations aux passages ; ne réécrit jamais la réponse."
    module: "agents.verifier.agent"
  - id: senegal
    enabled: true
    priority: 70
    role: "Senegal Intelligence"
    description: "Préfère les sources nationales ; refuse plutôt que de répondre mondial."
    module: "agents.senegal.agent"
  - id: knowledge_architect
    enabled: true
    priority: 60
    role: "Knowledge Architect"
    description: "Propose une entrée de manifeste en DRAFT ; ne l'applique jamais."
    module: "agents.knowledge_architect.agent"
  - id: data_engineer
    enabled: true
    priority: 50
    role: "Data Engineer"
    description: "Décrit une série structurée ; refuse celle sans unité ni période."
    module: "agents.data_engineer.agent"

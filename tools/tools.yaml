version: "1.0"

tools:
  # Lit l'écran par l'arbre d'accessibilité du système ; il n'agit pas — agir est
  # le chapitre 06 du VOLET 34. Sur un serveur sans session graphique — le cas de
  # l'image de production — il refuse en nommant la raison plutôt que de rendre
  # une liste vide, qui se lirait « l'écran est vide ».
  - id: screen
    enabled: true
    category: system
    module: "tools.screen.tool"
    class: "ScreenTool"
    capability:
      effects: [read]
      data_scope: system
      requires_approval: false
      unattended: false
      reason: "L'écran peut afficher n'importe quelle donnée privée ; nul ne peut le savoir à l'avance."
    config: {}

  # Propose un geste, n'en exécute aucun sans décision humaine. La cible est un
  # élément identifié — rôle, libellé, bornes — jamais un couple de coordonnées :
  # « cliquer en (412, 380) » n'est pas approuvable par un humain (ADR-017 §4).
  # Sans moteur d'approbation, l'outil ferme au lieu de dégrader.
  - id: gui
    enabled: true
    category: system
    module: "tools.gui.tool"
    class: "GUITool"
    capability:
      effects: [write]
      data_scope: system
      requires_approval: true
      unattended: false
      reason: "Un geste sur l'interface est un acte, et ADR-017 le soumet à une décision humaine."
    config: {}

  # Access is confined to the project root. Writing is disabled: agents report
  # what should change instead of changing it. Set allow_write to true only when
  # autonomous edits are actually wanted.
  - id: filesystem
    enabled: true
    category: system
    module: "tools.filesystem.tool"
    class: "FileSystemTool"
    capability:
      effects: [read, write]
      data_scope: system
      requires_approval: false
      unattended: false
      reason: "Une écriture sur le disque n'est pas annulable ici ; elle demande un témoin."
      # L'outil peut écrire ; ces six opérations, non. Ce sont les seules que
      # les agents appellent (mesuré le 2026-08-14 sur les 16 agents), et
      # `allow_write: false` les borne une deuxième fois.
      pre_approved:
        - operation: read
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Lire un fichier du dépôt ne modifie rien et reste sous la racine du projet."
        - operation: search
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Chercher des fichiers ne modifie rien."
        - operation: list
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Lister un répertoire ne modifie rien."
        - operation: stat
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Lire les métadonnées d'un fichier ne modifie rien."
        - operation: exists
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Tester la présence d'un fichier ne modifie rien."
        - operation: tail
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Lire la fin d'un journal ne modifie rien."
    config:
      allow_write: false
      max_read_bytes: 5242880
      max_results: 500

  # Commands run without a shell, so arguments cannot inject a second command.
  # Only the executables listed here can run.
  - id: terminal
    enabled: true
    category: system
    module: "tools.terminal.tool"
    class: "TerminalTool"
    capability:
      effects: [read, write]
      data_scope: system
      requires_approval: true
      unattended: false
      reason: "Une commande peut faire tout ce que l'utilisateur peut faire."
      # `python` exécute n'importe quoi — d'où l'approbation sur l'outil. Mais
      # `python -m pytest` exécute la suite de tests, et rien d'autre : c'est
      # la raison d'être de l'agent testeur, qui tourne sans humain. C'est la
      # **borne** qui est approuvée, jamais l'outil entier. Affaiblir la
      # déclaration ci-dessus aurait ouvert `python -c` du même coup.
      pre_approved:
        - operation: "python -m pytest"
          approved_by: "propriétaire du projet"
          approved_on: "2026-08-14"
          rationale: "Exécuter la suite de tests est la raison d'être de l'agent testeur ; la commande ne prend pas de code en argument."
    config:
      allowed_commands:
        - python
        - python3
        - py
        - pytest
        - git
        - echo
      timeout: 120

  # Read-only. Pushing to a protected branch and force pushing are refused in
  # code, per .claude/rules/git-workflow.md.
  - id: git
    enabled: true
    category: development
    module: "tools.git.tool"
    class: "GitTool"
    capability:
      effects: [read]
      data_scope: system
      requires_approval: false
      unattended: true
    config:
      allow_write: false
      protected_branches:
        - main
        - master

  # The token is read from GITHUB_TOKEN at call time and never stored here.
  # Without a token the API is queried anonymously, with a lower rate limit.
  - id: github
    enabled: true
    category: development
    module: "tools.github.tool"
    class: "GitHubTool"
    capability:
      effects: [read, external]
      data_scope: public
      requires_approval: false
      unattended: true
    config:
      timeout: 15

  # Short timeout and a single retry: when the network is down the agents must
  # find out quickly and carry on, not stall the whole pipeline.
  - id: web_search
    enabled: true
    category: internet
    module: "tools.web_search.tool"
    class: "WebSearchTool"
    capability:
      effects: [read, external]
      data_scope: public
      requires_approval: false
      unattended: true
    config:
      timeout: 5
      max_retries: 1
      cache_ttl: 300

  - id: browser
    enabled: true
    category: internet
    module: "tools.browser.tool"
    class: "BrowserTool"
    capability:
      effects: [read, external]
      data_scope: public
      requires_approval: false
      unattended: false
      reason: "Un navigateur exécute le code des pages visitées ; son résultat dépend d'un tiers."
    config: {}

  - id: api
    enabled: true
    category: integration
    module: "tools.api.tool"
    class: "APITool"
    capability:
      effects: [read, write, external]
      data_scope: public
      requires_approval: true
      unattended: false
      reason: "L'appel est arbitraire : le registre ne peut pas savoir ce qu'il déclenche."
    config: {}

  - id: database
    enabled: true
    category: storage
    module: "tools.database.tool"
    class: "DatabaseTool"
    capability:
      effects: [read, write]
      data_scope: system
      requires_approval: false
      unattended: false
      reason: "Une écriture en base n'est pas annulable ici."
    config: {}

  # Exposes the Model Engine through the Tool Engine. Generation returns a
  # status, so an agent can see that no provider answered instead of receiving
  # text nobody produced.
  - id: model
    enabled: true
    category: ai
    module: "tools.model.tool"
    class: "ModelTool"
    capability:
      # `system` a d'abord été écrit ici, et le plafond des rôles l'a montré
      # faux : il refusait la génération à tout utilisateur. L'outil ne lit ni
      # la configuration ni les identifiants — il passe une invite à un modèle
      # local et rend son texte. Sa portée est celle de ce qu'on lui donne.
      effects: [read]
      data_scope: public
      requires_approval: false
      unattended: true
    config:
      max_tokens: 1024
      temperature: 0.7

  - id: memory
    enabled: true
    category: ai
    module: "tools.memory.tool"
    class: "MemoryTool"
    capability:
      effects: [read, write]
      data_scope: user_private
      requires_approval: false
      unattended: true
    config: {}

  - id: rag
    enabled: true
    category: ai
    module: "tools.rag.tool"
    class: "RAGTool"
    capability:
      effects: [read]
      data_scope: public
      requires_approval: false
      unattended: true
    config: {}

  - id: embeddings
    enabled: true
    category: ai
    module: "tools.embeddings.tool"
    class: "EmbeddingsTool"
    capability:
      effects: [read]
      data_scope: public
      requires_approval: false
      unattended: true
    config: {}

  - id: ocr
    enabled: true
    category: documents
    module: "tools.ocr.tool"
    class: "OCRTool"
    capability:
      effects: [read]
      data_scope: user_private
      requires_approval: false
      unattended: true
    config: {}

  - id: pdf
    enabled: true
    category: documents
    module: "tools.pdf.tool"
    class: "PDFTool"
    capability:
      effects: [read]
      data_scope: user_private
      requires_approval: false
      unattended: true
    config: {}

  - id: email
    enabled: true
    category: communication
    module: "tools.email.tool"
    class: "EmailTool"
    capability:
      effects: [read, write, external]
      data_scope: user_private
      requires_approval: true
      unattended: false
      reason: "Un courriel parti ne revient pas, et il emporte de la donnée privée hors de la machine."
    config: {}

  - id: calendar
    enabled: true
    category: communication
    module: "tools.calendar.tool"
    class: "CalendarTool"
    capability:
      effects: [read, write, external]
      data_scope: user_private
      requires_approval: true
      unattended: false
      reason: "Un agenda partagé publie une donnée privée auprès de tiers invités."
    config: {}

  # Désactivé pour une raison de sécurité, pas par manque de dépendance.
  # L'outil sait `run_container`, `stop_container` et `remove_container`. Depuis
  # l'intérieur du conteneur de production, cela suppose de monter
  # /var/run/docker.sock — c'est-à-dire de donner à un agent l'équivalent de
  # root sur la machine hôte : il lui suffirait de lancer un conteneur
  # privilégié montant `/`. Aucune tâche de la plateforme ne demande cela.
  # Le réactiver est une décision d'exploitation, à prendre en connaissance de
  # cause et hors de l'image de production.
  - id: docker
    enabled: false
    category: deployment
    module: "tools.docker.tool"
    class: "DockerTool"
    capability:
      effects: [write]
      data_scope: system
      requires_approval: true
      unattended: false
      reason: "Un conteneur lancé sans témoin survit à la session qui l'a lancé."
    config: {}

  - id: logging
    enabled: true
    category: monitoring
    module: "tools.logging.tool"
    class: "LoggingTool"
    capability:
      effects: [write]
      data_scope: system
      requires_approval: false
      unattended: true
    config: {}

  - id: metrics
    enabled: true
    category: monitoring
    module: "tools.metrics.tool"
    class: "MetricsTool"
    capability:
      effects: [read]
      data_scope: system
      requires_approval: false
      unattended: true
    config: {}

  - id: agri_advice
    enabled: true
    category: ai
    module: "tools.agri_advice.tool"
    class: "AgriAdviceTool"
    capability:
      effects: [read]
      data_scope: public
      requires_approval: false
      unattended: true
    config: {}

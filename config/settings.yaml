version: "1.0"

project:
  name: "GalSen IA"
  environment: "development"

language:
  default: "fr"
  fallback: "en"

models:
  registry: "../models/models.yaml"
  default: "claude-sonnet"

agents:
  registry: "../agents/registry.yaml"

tools:
  registry: "../tools/tools.yaml"

workflows:
  registry: "../workflows/workflows.yaml"
  # Lu par RouterEngine et AgentRuntime via ConfigLoader. Ces réglages étaient
  # déclarés dans workflows.yaml, où personne ne les lisait : les valeurs
  # ci-dessous sont celles qui s'appliquaient réellement (les défauts du code).
  execution:
    failure:
      retry: true
      max_attempts: 3
      # `rollback` n'annule rien : il arrête le pipeline au premier échec.
      # Le nom est conservé pour ne pas casser la configuration existante ;
      # le comportement est décrit dans docs/architecture/orchestration.md.
      rollback: true

memory:
  schema: "../memory/schema.md"

logging:
  level: "info"
  save_history: true

security:
  sandbox: true
  require_confirmation_for_destructive_actions: true

performance:
  parallel_execution: true
  cache_enabled: true

developer:
  auto_documentation: true
  auto_review: true
  auto_testing: true